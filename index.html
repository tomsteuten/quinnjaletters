<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="only light" />
  <meta name="supported-color-schemes" content="light" />
  <meta name="theme-color" content="#fff8e7" />
  <title>Quinnja Letters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div id="stage-status" class="sr-only" aria-live="polite"></div>
    <button id="btn-global-home" class="icon-btn global-home-btn" aria-label="Go to home screen" hidden>
      <img src="assets/icons/home.svg" alt="" />
    </button>

    <section id="stage-home" class="stage active" aria-label="Home">
      <button id="btn-open-settings-home" class="icon-btn settings-launch" aria-label="Open parent settings">
        <img src="assets/icons/gear.svg" alt="" />
      </button>

      <div class="home-wrap">
        <h1 class="home-title">Quinnja Letters</h1>
        <div class="mode-toggle" id="mode-toggle" role="group" aria-label="Learning mode">
          <button type="button" class="mode-toggle-btn mode-toggle-active" id="mode-toggle-letters" aria-pressed="true">ABC</button>
          <button type="button" class="mode-toggle-btn" id="mode-toggle-numbers" aria-pressed="false">123</button>
        </div>

        <div class="mascot-wrap mascot-idle" id="home-mascot-wrap">
          <!-- AI note: home mascot video swap is intentionally reversible.
               Keep the PNG fallback so rollback is one toggle in app.js. -->
          <video
            id="home-mascot-video"
            class="mascot-home"
            src="assets/processed/idlegreen_alpha_rgb_soft.webm"
            autoplay
            loop
            muted
            playsinline
            preload="none"
            aria-label="Quinnja idle animation"
          ></video>
          <img
            id="home-mascot-fallback"
            src="assets/quinnja.png"
            alt="Quinnja bear mascot"
            class="mascot-home"
            hidden
          />
        </div>

        <div class="active-letters-row" id="home-active-letters" aria-hidden="true" hidden></div>

        <div class="home-progress-dots" id="home-progress-dots" aria-label="Letter progress"></div>

        <div id="home-greeting" class="home-greeting" hidden></div>

        <button id="btn-start-session" class="start-btn" aria-label="Start session">
          <img src="assets/icons/play.svg" alt="" />
          <span>Start</span>
        </button>

        <div id="nfc-prompt" class="nfc-prompt" hidden>
          <img src="assets/icons/phone-tap.svg" alt="" />
          <span>Scan a letter tag</span>
        </div>
      </div>
    </section>

    <section id="stage-meet" class="stage" aria-label="Meet letter">
      <div class="session-dots" id="session-dots-meet"></div>
      <div class="meet-layout">
        <div class="mascot-wrap mascot-presenting" id="meet-mascot-wrap">
          <!-- AI note: meet mascot video swap is intentionally reversible.
               Keep the PNG fallback so rollback is one toggle in app.js. -->
          <video
            id="meet-mascot-video"
            class="mascot-meet"
            src="assets/processed/greenwaving_alpha_rgb_soft.webm"
            autoplay
            loop
            muted
            playsinline
            preload="none"
            aria-label="Quinnja greeting animation"
          ></video>
          <img
            id="meet-mascot-fallback"
            src="assets/quinnja.png"
            alt="Quinnja bear mascot"
            class="mascot-meet"
            hidden
          />
        </div>
        <div class="meet-letter-pair" aria-live="polite">
          <span class="meet-letter-upper" id="meet-letter-upper">S</span>
          <span class="meet-letter-lower" id="meet-letter-lower">s</span>
        </div>
        <div class="meet-quantity-dots" id="meet-quantity-dots" hidden></div>
        <div class="meet-cue" id="meet-cue" hidden></div>
      </div>
      <div class="meet-picture-cue" id="meet-picture-cue" hidden>
        <img id="meet-picture-cue-img" class="meet-picture-cue-img" alt="" />
        <span class="meet-picture-cue-word" id="meet-picture-cue-word"></span>
      </div>
      <div class="meet-actions" id="meet-actions">
        <button id="btn-meet-continue" class="icon-btn meet-go-btn" aria-label="Continue">
          <img src="assets/icons/arrow-right.svg" alt="" />
        </button>
        <button id="btn-meet-replay" class="icon-btn meet-hear-btn" aria-label="Hear again">
          <img src="assets/icons/speaker.svg" alt="" />
        </button>
      </div>
    </section>

    <section id="stage-pick" class="stage" aria-label="Pick letter">
      <div class="session-dots" id="session-dots-pick"></div>
      <div class="pick-layout">
        <div class="pick-top">
          <div class="pick-target-wrap">
            <div class="mascot-wrap mascot-encouraging" id="pick-mascot-wrap">
              <video
                id="pick-mascot-video"
                class="mascot-pick"
                src="assets/processed/tracinggreen_alpha_rgb_soft.webm"
                autoplay
                loop
                muted
                playsinline
                preload="none"
                aria-label="Quinnja encouraging animation"
              ></video>
              <video
                id="pick-wrong-video"
                class="mascot-pick"
                src="assets/processed/wrong.webm"
                muted
                playsinline
                preload="auto"
                hidden
                aria-label="Quinnja wrong answer reaction"
              ></video>
              <img src="assets/quinnja.png" alt="Quinnja bear mascot" class="mascot-pick" hidden id="pick-mascot-fallback" />
            </div>
            <div class="pick-letter" id="pick-target-letter" role="button" tabindex="0" aria-live="polite">S</div>
          </div>
        </div>

        <div class="pick-bottom">
          <div class="pick-prompt" id="pick-prompt" aria-hidden="true"></div>
          <div id="pick-options" class="pick-options" role="group" aria-label="Letter choices"></div>
          <div id="pick-feedback" class="sr-only" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section id="stage-trace" class="stage" aria-label="Trace letter">
      <div class="session-dots" id="session-dots-trace"></div>
      <div class="trace-stage-layout">
        <div class="trace-header">
          <div class="trace-letter" id="trace-letter" aria-live="polite">S</div>
          <div class="mascot-wrap mascot-encouraging" id="trace-mascot-wrap">
            <!-- AI note: trace mascot video swap is intentionally reversible.
                 Keep the PNG fallback so rollback is one toggle in app.js. -->
            <video
              id="trace-mascot-video"
              class="mascot-trace"
              src="assets/processed/tracinggreen_alpha_rgb_soft.webm"
              autoplay
              loop
              muted
              playsinline
              preload="none"
              aria-label="Quinnja trace coach animation"
            ></video>
            <img
              id="trace-mascot-fallback"
              src="assets/quinnja.png"
              alt="Quinnja bear mascot"
              class="mascot-trace"
              hidden
            />
  
          </div>
        </div>

        <div class="trace-board" id="trace-board">
          <svg id="trace-guide" viewBox="0 0 220 220" aria-hidden="true"></svg>
          <canvas id="trace-canvas" width="220" height="220" role="img" aria-label="Letter tracing canvas"></canvas>
        </div>

        <div class="trace-controls">
          <button id="btn-trace-clear" class="icon-btn action-icon" aria-label="Clear drawing">
            <img src="assets/icons/clear.svg" alt="" />
            <span class="action-label">Clear</span>
          </button>
          <svg id="trace-progress-ring" class="trace-progress-ring" viewBox="0 0 40 40" aria-label="Trace progress">
            <circle cx="20" cy="20" r="16" class="trace-progress-bg"></circle>
            <circle cx="20" cy="20" r="16" id="trace-progress-fill" class="trace-progress-fill"></circle>
          </svg>
          <button id="btn-trace-done" class="icon-btn action-icon action-icon-primary" aria-label="Done tracing">
            <img src="assets/icons/done.svg" alt="" />
            <span class="action-label">Done</span>
          </button>
        </div>
      </div>
    </section>

    <section id="stage-celebrate" class="stage" aria-label="Celebrate">
      <div class="session-dots" id="session-dots-celebrate"></div>
      <div class="celebrate-wrap">
        <div class="confetti-container" id="confetti-container" aria-hidden="true"></div>
        <div class="sparkles" aria-hidden="true">
          <span class="sparkle"></span>
          <span class="sparkle"></span>
          <span class="sparkle"></span>
          <span class="sparkle"></span>
          <span class="sparkle"></span>
          <span class="sparkle"></span>
          <span class="sparkle"></span>
          <span class="sparkle"></span>
          <span class="sparkle"></span>
          <span class="sparkle"></span>
        </div>
        <div class="mascot-wrap mascot-celebrating" id="celebrate-mascot-wrap">
          <!-- AI note: celebrate mascot video swap is intentionally reversible.
               Keep the PNG fallback in place so rollback is one toggle in app.js. -->
          <video
            id="celebrate-mascot-video"
            class="mascot-celebrate"
            src="assets/processed/green_trim_alpha_rgbkey_balanced.webm"
            autoplay
            loop
            muted
            playsinline
            preload="none"
            aria-label="Quinnja celebrating animation"
          ></video>
          <img
            id="celebrate-mascot-fallback"
            src="assets/quinnja.png"
            alt="Quinnja bear mascot"
            class="mascot-celebrate"
            hidden
          />

        </div>
        <div class="celebrate-letter-showcase">
          <img class="celebrate-traced-img" id="celebrate-traced-img" alt="Your traced letter" hidden />
          <div class="celebrate-letter-pair">
            <span class="celebrate-letter-main" id="celebrate-letter-main">S</span>
            <span class="celebrate-letter-side" id="celebrate-letter-side">s</span>
          </div>
        </div>
        <button id="btn-celebrate-next" class="icon-btn celebrate-next-btn" aria-label="Next letter">
          <img src="assets/icons/arrow-right.svg" alt="" />
        </button>
      </div>
    </section>

    <section id="stage-complete" class="stage" aria-label="Session complete">
      <button id="btn-open-settings-complete" class="icon-btn settings-launch" aria-label="Open parent settings">
        <img src="assets/icons/gear.svg" alt="" />
      </button>

      <div class="complete-wrap">
        <h2 class="complete-heading">Well done!</h2>
        <div class="mascot-wrap mascot-celebrating" id="complete-mascot-wrap">
          <video
            id="complete-mascot-video"
            class="mascot-celebrate"
            src="assets/processed/completegreen_alpha_rgb_balanced.webm"
            autoplay
            loop
            muted
            playsinline
            preload="none"
            aria-label="Quinnja session complete animation"
          ></video>
          <img
            id="complete-mascot-fallback"
            src="assets/quinnja.png"
            alt="Quinnja bear mascot"
            class="mascot-celebrate"
            hidden
          />
        </div>

        <div id="complete-letters" class="complete-letters" aria-label="Letters practised"></div>

        <div class="complete-actions">
          <button id="btn-replay" class="icon-btn complete-btn" aria-label="Replay session">
            <img src="assets/icons/replay.svg" alt="" />
          </button>
          <button id="btn-home" class="icon-btn complete-btn" aria-label="Go to home screen">
            <img src="assets/icons/home.svg" alt="" />
          </button>
        </div>
      </div>
    </section>

    <section id="stage-settings" class="stage" aria-label="Parent settings">
      <div class="settings-card">
        <div class="settings-header">
          <h2>Settings</h2>
          <button id="btn-save-settings" class="settings-btn settings-btn-primary" type="button">Save &amp; Close</button>
        </div>

        <div class="settings-section">
          <label class="settings-label" for="setting-child-name">Child's name</label>
          <input id="setting-child-name" class="settings-input" type="text" maxlength="30" placeholder="Enter name..." />
        </div>

        <div class="settings-section" id="settings-letter-section">
          <span class="settings-section-title">Active letters</span>
          <div id="letter-preset-selector" class="letter-preset-selector">
            <button type="button" class="letter-preset-btn" data-preset="satpin">SATPIN</button>
            <button type="button" class="letter-preset-btn" data-preset="all">Full Alphabet</button>
          </div>
          <details class="settings-collapsible" id="custom-letters-collapsible">
            <summary class="settings-collapsible-header">Customise letters</summary>
            <div class="settings-section-body">
              <div id="settings-letter-toggles" class="letter-toggle-grid"></div>
            </div>
          </details>
        </div>

        <div class="settings-section" id="settings-number-section" hidden>
          <span class="settings-section-title">Active numbers</span>
          <div id="settings-number-toggles" class="letter-toggle-grid"></div>
        </div>

        <details class="settings-collapsible" id="settings-case-section">
          <summary class="settings-collapsible-header">Display case</summary>
          <div class="settings-section-body">
            <div class="settings-radio-group">
              <label class="settings-radio"><input name="display-case" type="radio" value="uppercase" /> <span>Uppercase</span></label>
              <label class="settings-radio"><input name="display-case" type="radio" value="lowercase" /> <span>Lowercase</span></label>
              <label class="settings-radio"><input name="display-case" type="radio" value="both" /> <span>Both</span></label>
            </div>
            <div class="settings-subsection">
              <span class="settings-section-title">Trace practice case</span>
              <div class="settings-radio-group">
                <label class="settings-radio"><input name="trace-case" type="radio" value="uppercase" /> <span>Uppercase only</span></label>
                <label class="settings-radio"><input name="trace-case" type="radio" value="lowercase" /> <span>Lowercase only</span></label>
                <label class="settings-radio"><input name="trace-case" type="radio" value="alternate" /> <span>Alternate</span></label>
              </div>
            </div>
          </div>
        </details>

        <details class="settings-collapsible">
          <summary class="settings-collapsible-header">Audio</summary>
          <div class="settings-section-body">
            <label class="toggle-row">
              <span>Speech audio</span>
              <span class="toggle-switch"><input id="setting-audio" type="checkbox" /><span class="toggle-track"></span></span>
            </label>
            <label class="toggle-row">
              <span>Sound effects</span>
              <span class="toggle-switch"><input id="setting-sound-effects" type="checkbox" /><span class="toggle-track"></span></span>
            </label>
            <label class="toggle-row">
              <span>Background music</span>
              <span class="toggle-switch"><input id="setting-ambient" type="checkbox" /><span class="toggle-track"></span></span>
            </label>
          </div>
        </details>

        <details class="settings-collapsible" id="settings-speech-group">
          <summary class="settings-collapsible-header">Voice personalisation</summary>
          <div class="settings-section-body">
            <label class="toggle-row">
              <span>Say child's name during praise</span>
              <span class="toggle-switch"><input id="setting-speech-synth" type="checkbox" /><span class="toggle-track"></span></span>
            </label>
            <div class="settings-subsection" id="speech-synth-options" hidden>
              <label class="settings-label" for="setting-speech-voice">Voice</label>
              <select id="setting-speech-voice" class="settings-input"></select>
              <label class="settings-label" for="setting-speech-rate">Speed</label>
              <input id="setting-speech-rate" type="range" min="0.7" max="1.3" step="0.1" value="0.9" />
              <label class="settings-label" for="setting-speech-pitch">Pitch</label>
              <input id="setting-speech-pitch" type="range" min="0.7" max="1.4" step="0.1" value="1.0" />
              <button id="btn-test-speech" class="settings-btn settings-btn-secondary" type="button">Test voice</button>
            </div>
          </div>
        </details>

        <details class="settings-collapsible" id="settings-recording-group">
          <summary class="settings-collapsible-header">Record your voice</summary>
          <div class="settings-section-body">
            <p class="settings-hint">Record praise or celebration messages in your own voice (max 3s each).</p>
            <div id="recording-slots" class="recording-slots"></div>
          </div>
        </details>

        <details class="settings-collapsible">
          <summary class="settings-collapsible-header">Other</summary>
          <div class="settings-section-body">
            <label class="toggle-row">
              <span>Formation guide default on</span>
              <span class="toggle-switch"><input id="setting-guide-default" type="checkbox" /><span class="toggle-track"></span></span>
            </label>
            <label class="toggle-row">
              <span>NFC mode</span>
              <span class="toggle-switch"><input id="setting-nfc-mode" type="checkbox" /><span class="toggle-track"></span></span>
            </label>
          </div>
        </details>

        <div class="settings-footer">
          <div class="settings-progress" id="settings-progress"></div>
          <div class="settings-footer-actions">
            <button id="btn-reset-progress" class="settings-btn settings-btn-secondary" type="button">Reset progress</button>
          </div>
        </div>

        <p id="settings-message" class="settings-message" aria-live="polite"></p>
      </div>
    </section>

    <div id="confirm-overlay" class="confirm-overlay" hidden>
      <div class="confirm-card">
        <p class="confirm-text">Go back to Home?</p>
        <div class="confirm-actions">
          <button id="btn-confirm-stay" class="icon-btn confirm-btn" aria-label="Stay here">
            <span class="confirm-x">&times;</span>
          </button>
          <button id="btn-confirm-leave" class="icon-btn confirm-btn confirm-btn-yes" aria-label="Go home">
            <img src="assets/icons/home.svg" alt="" />
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="audio.js"></script>
  <script src="speech.js"></script>
  <script src="nfc.js"></script>
  <script src="app.js"></script>
</body>
</html>
